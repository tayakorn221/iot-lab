; 01-sensor-node — ด่าน 1: ESP32 + BME280 → MQTT
; ทุกเวอร์ชันล็อกตายตัว เพื่อให้ build วันนี้กับปีหน้าได้ไฟล์เหมือนกัน (ดู docs/decisions/0001-stack.md)

[platformio]
; pio run / pio run -t upload ทำแค่ node-01 — บอร์ดที่สองสั่ง -e node-02 เอง กันแฟลชทับผิดตัว
default_envs = node-01

[env]
platform = espressif32@6.13.0          ; = Arduino core for ESP32 2.0.17
board = esp32dev                        ; ESP32-WROOM-32 ใช้ได้ทั้งบอร์ด 30 และ 38 ขา
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    256dpi/MQTT@2.5.2                   ; MQTT client ที่ publish QoS 1 ได้ (PubSubClient ส่งได้แค่ QoS 0)
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit BMP280 Library@2.6.8  ; เผื่อร้านส่ง BMP280 มา — ยังได้อุณหภูมิกับความกด
build_flags =
    -DCORE_DEBUG_LEVEL=1                ; ให้ log_e ของ core (เช่น WiFiMulti หา SSID ไม่เจอ) โผล่ใน serial

; หนึ่ง env = หนึ่งบอร์ด · device_id ตาม contract: a-z 0-9 และ - เท่านั้น (เช็กตอน compile)
[env:node-01]
build_flags = ${env.build_flags} '-DDEVICE_ID="node-01"'

[env:node-02]
build_flags = ${env.build_flags} '-DDEVICE_ID="node-02"'
