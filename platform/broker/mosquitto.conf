# Mosquitto สำหรับห้องทดลองในเครือข่ายบ้าน/สำนักงานเท่านั้น
# allow_anonymous true = ใครในวง LAN เดียวกันก็ส่งเข้าได้ ห้ามเปิดพอร์ตนี้ออกอินเทอร์เน็ต
# ด่าน 2 (ตั้งในสำนักงาน) ให้เปลี่ยนเป็น password_file ก่อนตั้งเครื่องจริง
# ด่าน 4 ปิดให้ครบ: TLS พอร์ต 8883 · credential แยกต่อเครื่อง · ACL ต่อ topic (ดู ROADMAP)
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
