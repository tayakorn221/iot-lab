# ฝั่งรับข้อมูลของ iot-lab
# ด่าน 1 มีแค่ broker — ingest กับ dashboard จะเพิ่มเป็น service ถัดไปในไฟล์นี้
services:
  broker:
    image: eclipse-mosquitto:2
    container_name: iotlab-broker
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
      - broker-log:/mosquitto/log

volumes:
  broker-data:
  broker-log:
